# Pre-commit hooks for treeweave. Adapted from the Flatiron Institute finufft
# setup (https://github.com/flatironinstitute/finufft).
#
# Install once per clone:  pre-commit install
# Run on the whole tree:   pre-commit run --all-files
#
# MATLAB/mwrap sources (.m / .mw) and the checked-in mwrap gateway under
# bindings/matlab/generated/ (treeweave_mex_gen.cpp + tw_*.m) are machine-generated
# and excluded globally from formatting/hygiene. include/treeweave_version.h is
# generated by treeweave_generate_version.cmake (the update-version hook below)
# and gitignored, so the formatters must not fight it.
exclude: '\.m$|\.mw$|^bindings/matlab/generated/|^include/treeweave_version\.h$'

repos:
  # --- C / C++: staged hunks only via git-clang-format ---
  # Uses a wrapper script to work around git-clang-format's fixed temp-index
  # path (.git/clang-format-index), which leaves stale .lock files when the
  # pre-commit framework's concurrent git operations race with it.
  - repo: local
    hooks:
      - id: clang-format-staged
        name: clang-format (staged hunks)
        entry: python tools/clang-format-staged.py
        language: python
        additional_dependencies: [clang-format==22.*]
        pass_filenames: true
        require_serial: true
        types_or: [c++, c, cuda]
        files: \.(c|cc|cpp|h|hpp|cu|cuh)$
        # treeweave_mex_gen.cpp is generated by mwrap; the rest of the C ABI and
        # core live outside bindings/matlab. (CUDA globs are harmless, since
        # treeweave has no .cu/.cuh today, and they keep the config aligned with
        # finufft.)
        exclude: '^bindings/matlab/'
      - id: gersemi-staged
        name: gersemi (staged hunks)
        entry: python tools/gersemi-staged.py
        language: python
        additional_dependencies: [gersemi==0.27.1]
        pass_filenames: true
        require_serial: true
        # *.cmake.in is covered too: gersemi 0.27.1 parses treeweaveConfig.cmake.in's
        # @PACKAGE_INIT@ placeholder cleanly.
        files: '(^|/)(CMakeLists\.txt|[^/]+\.cmake(\.in)?)$'
      # --- JS/TS: reformat staged hunks only via prettier (changed lines, like
      # the C++/CMake hooks). prettier is the only mainstream JS formatter with a
      # CLI char-range flag; the binary comes from bindings/js/node_modules. ---
      - id: prettier-staged
        name: prettier (staged hunks)
        entry: python tools/prettier-staged.py
        language: python
        pass_filenames: true
        require_serial: true
        files: ^bindings/js/.*\.(ts|mjs|cjs|js)$
        exclude: ^bindings/js/dist/
      # --- Version header: refresh the untracked include/treeweave_version.h
      # from VERSION + git state. It is gitignored, so there is nothing to
      # re-stage and a stale copy cannot reach a commit. ---
      - id: update-treeweave-version
        name: Refresh include/treeweave_version.h
        entry: cmake -P cmake/treeweave_generate_version.cmake
        language: system
        always_run: true
        pass_filenames: false
  # --- Python (reformat changed lines only, like the staged C++ hook) ---
  - repo: https://github.com/akaihola/darker
    rev: v3.0.0
    hooks:
      - id: darker
        args: [--formatter=ruff]
        # tomli: darker's ruff formatter does `import tomli as tomllib` on
        # Python < 3.11; the pre-commit env here is 3.10, so pin it in.
        additional_dependencies: [ruff==0.15.9, tomli]
  # --- Shell ---
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
  # --- Standard file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # conda/recipe/meta.yaml is a Jinja template (`{% set %}`), not plain
        # YAML, and check-yaml's parser chokes on it (the only templated YAML here).
        exclude: '^conda/recipe/meta\.yaml$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-illegal-windows-names
      - id: mixed-line-ending
      # Added beyond the finufft baseline, meaningful for a multi-OS
      # (Linux/macOS/Windows) release matrix and a perf repo with bench data.
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
  # --- Spell-check code and docs ---
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # bench/ is an append-only experiment log; build/ and extern/ are
        # generated / vendored.
        exclude: '^(bench/|build/|extern/)'
        # Domain false positives: "nd" = N-dimensional; "re-using" is correct;
        # "inout" is the Fortran intent(inout) keyword; "fo" is MSVC's /Fo
        # object-output flag.
        args: [-L, "nd,re-using,inout,fo"]
  # --- Python package metadata validation ---
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]
        files: ^bindings/python/pyproject\.toml$
