version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs-pip:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"
    ignore:
      # Only nanobind 3.0.0 breaks the clang-cl Windows wheel; 3.0.1 has the
      # fix (wjakob/nanobind#1421). See bindings/python/pyproject.toml.
      - dependency-name: "nanobind"
        versions: ["==3.0.0"]
    groups:
      python-pip:
        patterns:
          - "*"
