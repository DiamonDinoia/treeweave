version: 2
updates:
  - package-ecosystem: "github-actions"
    # The composite action pins setup-cpp and sccache for every workflow, so it
    # has to be a scanned directory of its own.
    directories:
      - "/"
      - "/.github/actions/setup-cpp"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs-pip:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"
    ignore:
      # nanobind 3.0 breaks the clang-cl Windows wheel; see the comment at the
      # top of bindings/python/pyproject.toml. Later 3.x is allowed.
      - dependency-name: "nanobind"
        versions: ["==3.0.*"]
    groups:
      python-pip:
        patterns:
          - "*"
