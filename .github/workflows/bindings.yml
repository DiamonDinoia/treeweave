name: Bindings

# Exercises the language wrappers' existing test suites, which the main CI
# never builds. Python runs the nanobind extension's pytest suite; Julia
# dlopens the freshly built libtreeweave_c and runs runtests.jl. Both reuse the
# CTest targets registered by cmake/treeweave_bindings.cmake (python_treeweave /
# julia_treeweave), so this is purely a CI wiring layer.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (nanobind) bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.0
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python build/test deps
        run: python -m pip install --upgrade pip pytest numpy "nanobind>=2.0"

      - name: Configure + build
        run: |
          cmake --preset bindings-python
          cmake --build build/bindings-python -j

      - name: Run pytest suite (python_treeweave)
        run: ctest --test-dir build/bindings-python -R python_treeweave --output-on-failure

  julia:
    name: Julia bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.0
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Configure + build libtreeweave_c
        run: |
          cmake --preset bindings-julia
          cmake --build build/bindings-julia -j --target treeweave_c

      - name: Run Julia suite (julia_treeweave)
        run: ctest --test-dir build/bindings-julia -R julia_treeweave --output-on-failure

  octave:
    name: Octave bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Octave ships no stable MEX ABI across versions, so we don't distribute
      # prebuilt Octave binaries — this builds from source with mkoctfile.
      - name: Install Octave + toolchain
        # octave-dev (renamed from liboctave-dev on 24.04) pulls octave and
        # provides mkoctfile + headers. cmake/ninja/g++ are preinstalled on the
        # runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y octave-dev

      # Builds libtreeweave_c, fetches the mwrap generator via CPM, generates the
      # gateway + tw_*.m from treeweave.mw, and compiles the Octave MEX with
      # mkoctfile — all from CMake (no Makefile). bindings-octave sets
      # TREEWEAVE_BUILD_MATLAB=ON; with only mkoctfile present, the Octave
      # backend is selected.
      - name: Configure + build the Octave MEX
        run: |
          cmake --preset bindings-octave
          cmake --build build/bindings-octave -j

      # test_treeweave.m calls error() on any failure -> octave exits non-zero.
      - name: Run Octave suite (matlab_treeweave)
        run: ctest --test-dir build/bindings-octave -R matlab_treeweave --output-on-failure

  # Real MATLAB (not Octave): setup-matlab@v3 puts MATLAB on PATH so the
  # bindings-matlab preset's FindMatlab picks it up and the MEX compiles — that
  # build is the hard gate here. Actually *running* the suite needs a license,
  # which MathWorks' hosted licensing does not reliably grant for `matlab -batch`
  # launched outside matlab-actions/run-command (observed: "MathWorks Licensing
  # Error 1"). The run step is therefore best-effort; the Octave job above runs
  # the identical `matlab_treeweave` test and is the blocking runtime gate.
  matlab:
    name: MATLAB bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.0
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      # bindings-matlab sets TREEWEAVE_BUILD_MATLAB=ON; with MATLAB (and no
      # mkoctfile) present, the MATLAB MEX backend is selected. mwrap is fetched
      # via CPM and the gateway + tw_*.m are generated from treeweave.mw.
      - name: Configure + build the MATLAB MEX
        run: |
          cmake --preset bindings-matlab
          cmake --build build/bindings-matlab -j

      # test_treeweave.m calls error() on any failure -> matlab -batch exits non-zero.
      # Best-effort: skip blocking CI when no MATLAB license is available on the
      # runner (the Octave job is the blocking runtime gate). Build above stays a gate.
      - name: Run MATLAB suite (matlab_treeweave)
        continue-on-error: true
        run: ctest --test-dir build/bindings-matlab -R matlab_treeweave --output-on-failure

  fortran:
    name: Fortran bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.0
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Configure + build
        run: |
          cmake --preset bindings-fortran
          cmake --build build/bindings-fortran -j

      # test_treeweave.f90 ends with `error stop` on any failure -> nonzero exit.
      - name: Run Fortran test (fortran_treeweave)
        run: ctest --test-dir build/bindings-fortran -R fortran_treeweave --output-on-failure

  # Builds BOTH JS backends — the native N-API addon (bindings-js) and the WASM
  # module (bindings-js-wasm, via emsdk) — then runs the node:test suite, which
  # exercises whichever backends it finds in dist/ (here: both).
  js:
    name: JavaScript/TypeScript bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.0
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.9

      - name: Install npm deps
        run: npm ci
        working-directory: bindings/js

      - name: Configure + build the native (.node) backend
        run: |
          cmake --preset bindings-js
          cmake --build build/bindings-js -j --target treeweave_node treeweave_js_ts

      - name: Configure + build the WASM backend
        run: |
          cmake --preset bindings-js-wasm
          cmake --build build/bindings-js-wasm -j --target treeweave_wasm treeweave_js_ts

      # The suite runs both backends found in dist/ (node:test, via CTest).
      - name: Run JS suite (js_treeweave)
        run: ctest --test-dir build/bindings-js -R js_treeweave --output-on-failure
