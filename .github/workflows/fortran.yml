name: Fortran

# Fortran wrapper: a thin iso_c_binding shim over the C ABI; builds and runs
# test_treeweave.f90 via the fortran_treeweave CTest target. Split out from the
# former bindings.yml so it earns its own status badge.
on:
  push:
    branches: [main]
  pull_request:
  # Branch runs: this workflow gates the release and fires on push to main
  # only, so a change to it has no other way to run before it lands.
  workflow_dispatch:

concurrency:
  group: fortran-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fortran:
    name: Fortran bindings (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runs-on: ubuntu-24.04,     arch: x86-64-v3 }
          - { name: linux-aarch64, runs-on: ubuntu-24.04-arm, arch: armv8-a }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Configure + build
        run: |
          cmake --preset bindings-fortran -DTREEWEAVE_ARCH=${{ matrix.arch }}
          cmake --build build/bindings-fortran -j

      # test_treeweave.f90 ends with `error stop` on any failure -> nonzero exit.
      - name: Run Fortran test (fortran_treeweave)
        run: ctest --test-dir build/bindings-fortran -R fortran_treeweave --output-on-failure
