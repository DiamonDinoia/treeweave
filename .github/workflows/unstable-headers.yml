name: Unstable headers

# Rolling, arch-independent C++ headers bundle from the latest GREEN main CI —
# the "bleeding edge, no CMake" companion to the stable release asset (issue #20).
#
# Called `unstable` (not `nightly`) on purpose: it refreshes on EVERY green main
# CI, not on a nightly schedule, so it always reflects current main.
#
# It does NOT cut a new release each run (that would spam the release feed).
# Instead it maintains ONE prerelease with the fixed tag `unstable`, and just
# CLOBBERS its treeweave-cxx-headers.tar.gz asset in place. So there is exactly
# one unstable entry, always pointing at a stable URL:
#
#   .../releases/download/unstable/treeweave-cxx-headers.tar.gz
#
# Because it's a prerelease, GitHub's `/releases/latest/` (used for the stable
# download) keeps ignoring it — stable users are unaffected.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: unstable-headers
  cancel-in-progress: true

permissions:
  contents: write  # create/refresh the `unstable` prerelease + its asset

jobs:
  unstable:
    name: Refresh unstable headers prerelease
    # Only on a successful CI run on main (or a manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@8170d66c458f4a045220b7b0966c10940bb2a15d  # v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - name: Build the consolidated headers bundle
        run: |
          cmake -S . -B build -G Ninja -DTREEWEAVE_BUILD_EXAMPLES=ON
          cmake --build build -j
          tar -C build -czf treeweave-cxx-headers.tar.gz include

      - name: Publish / refresh the `unstable` prerelease (edit in place, no spam)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          # Create the rolling prerelease once; thereafter just replace its asset.
          if ! gh release view unstable --repo "$repo" >/dev/null 2>&1; then
            gh release create unstable --repo "$repo" --prerelease \
              --title "treeweave unstable (main)" \
              --notes "Rolling C++ headers bundle built from the latest green main CI. Unstable — for a pinned/stable build use a tagged release (see docs/install.rst)."
          fi
          gh release upload unstable --repo "$repo" --clobber treeweave-cxx-headers.tar.gz
