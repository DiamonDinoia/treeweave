name: TestPyPI

# Publishes a staging build to https://test.pypi.org/ for every *green* commit
# on the default branch: it runs only after the CI workflow succeeds, so a
# broken commit never publishes. The version is X.Y.Z.devN, where X.Y.Z is the
# root CMakeLists project version and N is the number of commits since the last
# v* release tag, so each commit gets a unique, monotonically increasing dev
# version and TestPyPI never rejects a re-upload. This is the dry run for the
# real PyPI publish: it exercises the full wheel matrix + sdist + metadata.
#
# Because it triggers on CI's workflow_run, the checkout steps pin
# workflow_run.head_sha: the exact commit CI validated, not default-branch HEAD.
#
# Publishing uses PyPI Trusted Publishing (OIDC), no API token to store.
# One-time setup on test.pypi.org -> the `treeweave` project -> Publishing:
#   Owner: DiamonDinoia | Repo: treeweave
#   Workflow: testpypi.yml | Environment: testpypi
# (Create a "pending publisher" before the project's first upload.)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compute the shared X.Y.Z.devN version once so every builder pins the same one.
  version:
    name: Derive dev version
    # Publish only green *pushes*: manual dispatch, or a CI run that succeeded
    # AND was driven by a push, so a CI run from any other trigger (a manual
    # re-run, etc.) can't republish an identical .devN for an unchanged commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # the commit CI validated
          fetch-depth: 0   # need tags + full history for the commit count
      - id: v
        shell: bash
        run: |
          base=$(tr -d '[:space:]' < VERSION)   # single source of truth: ./VERSION (MAJOR.MINOR.PATCH)
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$last" ]; then
            n=$(git rev-list "${last}..HEAD" --count)
          else
            n=$(git rev-list HEAD --count)   # no release yet: count from root
          fi
          echo "version=${base}.dev${n}" >> "$GITHUB_OUTPUT"
          echo "Derived dev version: ${base}.dev${n}"

  # The wheel/sdist matrix lives in wheels.yml, the same one the real PyPI
  # release uses. Duplicating it here let the Windows entry drift: it kept
  # cl.exe + multiarch long after wheels.yml moved to clang-cl, which both
  # blows the build time cap and ships a wheel that faults on import.
  build:
    name: build
    needs: version
    uses: ./.github/workflows/wheels.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      dev-version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish to TestPyPI
    needs: [build]
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write   # OIDC token for Trusted Publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true   # tolerate a re-run of the same commit's version
