name: Octave

# Octave wrapper: builds the MEX from source with mkoctfile (Octave has no stable
# MEX ABI, so nothing is prebuilt) and runs the matlab_treeweave CTest target.
# This job is the blocking runtime gate for the MATLAB/Octave binding. Real
# MATLAB (matlab.yml) only gates the build, since its hosted license is unreliable in
# CI. Split out from the former bindings.yml so it earns its own status badge.
on:
  push:
    branches: [main]
  pull_request:
  # Branch runs: this workflow gates the release and fires on push to main
  # only, so a change to it has no other way to run before it lands.
  workflow_dispatch:

concurrency:
  group: octave-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  octave:
    name: Octave bindings (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runs-on: ubuntu-24.04,     arch: x86-64-v3 }
          - { name: linux-aarch64, runs-on: ubuntu-24.04-arm, arch: armv8-a }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # octave-dev (renamed from liboctave-dev on 24.04) pulls octave and
      # provides mkoctfile + headers. cmake/ninja/g++ are preinstalled on the
      # runner image.
      - name: Install Octave + toolchain
        run: |
          # ports.ubuntu.com serves an index stale enough to 404 a pool file
          # often enough to fail a release gate. Refresh and retry once.
          sudo apt-get update
          sudo apt-get install -y octave-dev ||
            { sudo apt-get update; sudo apt-get install -y octave-dev; }

      # Builds libtreeweave_c, fetches the mwrap generator via CPM, generates the
      # gateway + tw_*.m from treeweave.mw, and compiles the Octave MEX with
      # mkoctfile: all from CMake (no Makefile). bindings-octave sets
      # TREEWEAVE_BUILD_MATLAB=ON; with only mkoctfile present, the Octave
      # backend is selected.
      - name: Configure + build the Octave MEX
        run: |
          cmake --preset bindings-octave -DTREEWEAVE_ARCH=${{ matrix.arch }}
          cmake --build build/bindings-octave -j

      # test_treeweave.m calls error() on any failure -> octave exits non-zero.
      - name: Run Octave suite (matlab_treeweave)
        run: ctest --test-dir build/bindings-octave -R matlab_treeweave --output-on-failure --no-tests=error

      # From examples.yml, which rebuilt this same preset only to run these two
      # steps. One leg, as it had.
      - name: Run Octave examples
        if: matrix.name == 'linux-x86_64'
        run: ctest --test-dir build/bindings-octave -R '^octave_example_' --output-on-failure --no-tests=error

      - name: Docs recipes
        if: matrix.name == 'linux-x86_64'
        run: tools/ci/docs-recipes.sh octave-dev

  compare-interpolators:
    name: Comparison against other Octave interpolators
    runs-on: ubuntu-24.04
    # Reaching 1e-10 with pchip on sin(30 x) takes the whole 2^20-knot cap, and
    # every method is grown to that accuracy before it is measured.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Octave + toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y octave-dev ||
            { sudo apt-get update; sudo apt-get install -y octave-dev; }

      - name: Configure + build the Octave MEX
        run: |
          cmake --preset bindings-octave -DTREEWEAVE_ARCH=x86-64-v3
          cmake --build build/bindings-octave -j

      - name: Self-test the comparison's own gates
        run: |
          octave --no-gui -q --path benchmarks \
            --eval "exit(compare_interpolators('--self-test'))"

      # --check-docs re-measures the deterministic columns and fails if the
      # Octave tables in docs/guides/performance.rst no longer match, and if
      # Octave's not-a-knot spline stops agreeing row for row with the published
      # scipy CubicSpline table. Regenerate with --rst.
      - name: Run the comparison and hold the docs tables to it
        run: |
          octave --no-gui -q \
            --path benchmarks --path bindings/matlab \
            --path build/bindings-octave/bindings/matlab/generated \
            --eval "exit(compare_interpolators('--check-docs'))"
