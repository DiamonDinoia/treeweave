name: JavaScript

# JS/TS wrapper: builds BOTH backends, the native N-API addon (bindings-js) and
# the WASM module (bindings-js-wasm, via emsdk), then runs the node:test suite,
# which exercises whichever backends it finds in dist/ (here: both). Split out
# from the former bindings.yml so it earns its own status badge.
on:
  push:
    branches: [main]
  pull_request:
  # Branch runs: this workflow gates the release and fires on push to main
  # only, so a change to it has no other way to run before it lands.
  workflow_dispatch:

concurrency:
  group: js-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JavaScript/TypeScript bindings (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runs-on: ubuntu-24.04,     arch: x86-64-v3 }
          - { name: linux-aarch64, runs-on: ubuntu-24.04-arm, arch: armv8-a }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.9

      - name: Install npm deps
        run: npm ci
        working-directory: bindings/js

      - name: Configure + build the native (.node) backend
        run: |
          cmake --preset bindings-js -DTREEWEAVE_ARCH=${{ matrix.arch }}
          cmake --build build/bindings-js -j --target treeweave_node treeweave_js_ts

      - name: Configure + build the WASM backend
        run: |
          cmake --preset bindings-js-wasm
          cmake --build build/bindings-js-wasm -j --target treeweave_wasm treeweave_js_ts

      # Validate the raw WASM module (treeweave.mjs + treeweave.wasm) on its own,
      # the standalone path shipped as a Release asset, driven directly through
      # the Emscripten runtime, independent of the TypeScript wrapper.
      - name: Smoke the raw WASM module
        run: node tests/smoke/wasm_smoke.mjs bindings/js/dist/treeweave.mjs

      # The suite runs both backends found in dist/ (node:test, via CTest).
      - name: Run JS suite (js_treeweave)
        run: ctest --test-dir build/bindings-js -R js_treeweave --output-on-failure --no-tests=error

      # From examples.yml, which rebuilt this same preset only to run these two
      # steps. One leg, as it had.
      - name: Run JavaScript examples
        if: matrix.name == 'linux-x86_64'
        run: node bindings/js/examples/simple_1d.mjs

      - name: Docs recipes
        if: matrix.name == 'linux-x86_64'
        run: tools/ci/docs-recipes.sh js-dev
