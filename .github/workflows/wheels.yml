name: Wheels

# Reusable builder (workflow_call only). Builds prebuilt Python wheels for every
# supported OS/arch with cibuildwheel, plus the sdist, at the static X.Y.Z that
# the build ref's root CMakeLists carries (scikit-build-core reads it via its
# regex metadata provider — no version pinning here). The Release orchestrator
# (release.yml) calls this and then publishes/attaches the artifacts; this
# workflow neither publishes nor creates a Release on its own.
#
# The C ABI (libtreeweave_c) is linked STATICALLY into the _treeweave nanobind
# extension (see bindings/python/treeweave_python.cmake), so there is no external
# shared library to vendor — wheels carry only the system C/C++ runtimes.
#
# Linux and macOS wheels enable TREEWEAVE_C_MULTIARCH at their family baseline,
# so one wheel dispatches by ISA at runtime. Apple silicon builds single-arch at
# apple-m1; Windows is SSE2-only, see the windows-x64 matrix entry.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from (commit SHA / branch / tag)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-24.04
            cibw-arch: x86_64
            cmake-args: "-DTREEWEAVE_C_MULTIARCH=ON -DTREEWEAVE_ARCH=x86-64"
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            cibw-arch: aarch64
            cmake-args: "-DTREEWEAVE_C_MULTIARCH=ON -DTREEWEAVE_ARCH=armv8-a"
          - name: macos-arm64
            runs-on: macos-14
            cibw-arch: arm64
            cmake-args: "-DTREEWEAVE_ARCH=apple-m1"
          - name: macos-x86_64
            runs-on: macos-15-intel
            cibw-arch: x86_64
            cmake-args: "-DTREEWEAVE_C_MULTIARCH=ON -DTREEWEAVE_ARCH=x86-64"
          # Multiarch OFF: static-linked into the extension it faults with an
          # illegal instruction inside treeweave_fit under every arch, sse2
          # included. The same C ABI as a DLL passes. Windows runs SSE2-only.
          - name: windows-x64
            runs-on: windows-2022
            cibw-arch: AMD64
            cmake-args: "-DTREEWEAVE_C_MULTIARCH=OFF -DTREEWEAVE_ARCH=x86-64 -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DTREEWEAVE_WARNINGS_AS_ERRORS=OFF"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # cl.exe blows the 90 min cap on the dim3 dispatch TUs, and multiarch
      # compiles them once per ISA level. cibuildwheel builds in the host
      # environment on Windows, so vcvarsall and LLVM here reach the build.
      - name: Setup clang-cl + Ninja (Windows)
        if: matrix.name == 'windows-x64'
        uses: aminya/setup-cpp@8170d66c458f4a045220b7b0966c10940bb2a15d  # v1.8.1
        with:
          compiler: llvm
          cmake: true
          ninja: true
          vcvarsall: true

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: bindings/python
        env:
          CIBW_ARCHS: ${{ matrix.cibw-arch }}
          # scikit-build-core forwards CMAKE_ARGS to the core build; this is how
          # each runner pins its portable baseline / multiarch dispatch.
          CIBW_ENVIRONMENT: >-
            CMAKE_ARGS="${{ matrix.cmake-args }}"
            MACOSX_DEPLOYMENT_TARGET=11.0
          # Windows override: Ninja, because the default VS generator ignores
          # CMAKE_CXX_COMPILER and would build with cl.exe anyway.
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_ARGS="${{ matrix.cmake-args }}"
            CMAKE_GENERATOR=Ninja
          # Exercise each built wheel on its own platform (native runners, no
          # emulation) so a release wheel that imports/computes wrong is caught
          # here, not by users. {package} is the package-dir (bindings/python).
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: pytest {package}/tests

      # The cibuildwheel action runs from the repo root, so wheelhouse/ lands there.
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Build sdist
        run: pipx run build --sdist --outdir dist bindings/python
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
