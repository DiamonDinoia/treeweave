name: Wheels

# Reusable builder (workflow_call only). Builds prebuilt Python wheels for every
# supported OS/arch with cibuildwheel, plus the sdist, at the static X.Y.Z that
# the build ref's root CMakeLists carries (scikit-build-core reads it via its
# regex metadata provider: no version pinning here). The Release orchestrator
# (release.yml) calls this and then publishes/attaches the artifacts; this
# workflow neither publishes nor creates a Release on its own.
#
# The C ABI (libtreeweave_c) is linked STATICALLY into the _treeweave nanobind
# extension (see bindings/python/treeweave_python.cmake), so there is no external
# shared library to vendor: wheels carry only the system C/C++ runtimes.
#
# Every wheel except Apple silicon enables TREEWEAVE_C_MULTIARCH at its family
# baseline, so one wheel dispatches by ISA at runtime. Apple silicon builds
# single-arch at apple-m1: the platform has one ISA level.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from (commit SHA / branch / tag)'
        required: true
        type: string
      dev-version:
        description: 'X.Y.Z.devN to stamp into the wheels; empty builds the release version'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # TREEWEAVE_VERIFY_RUNGS on the multiarch legs: cibuildwheel builds
          # in a container/venv this workflow's steps cannot reach, so the
          # cross-rung symbol gate must run inside the build itself.
          - name: linux-x86_64
            runs-on: ubuntu-24.04
            cibw-arch: x86_64
            cmake-args: "-DTREEWEAVE_C_MULTIARCH=ON -DTREEWEAVE_VERIFY_RUNGS=ON -DTREEWEAVE_ARCH=x86-64"
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            cibw-arch: aarch64
            cmake-args: "-DTREEWEAVE_C_MULTIARCH=ON -DTREEWEAVE_VERIFY_RUNGS=ON -DTREEWEAVE_ARCH=armv8-a"
          - name: macos-arm64
            runs-on: macos-14
            cibw-arch: arm64
            cmake-args: "-DTREEWEAVE_ARCH=apple-m1"
          - name: macos-x86_64
            runs-on: macos-15-intel
            cibw-arch: x86_64
            cmake-args: "-DTREEWEAVE_C_MULTIARCH=ON -DTREEWEAVE_VERIFY_RUNGS=ON -DTREEWEAVE_ARCH=x86-64"
          # Multiarch static-linked into the extension used to fault with an
          # illegal instruction inside treeweave_fit at every level, sse2
          # included: the rungs shared weak symbols and the linker kept an
          # AVX-512 copy. The 0.0.5 fan-out defines those once in a baseline TU
          # and check_rung_symbols gates the objects, so the wheel dispatches.
          - name: windows-x64
            runs-on: windows-2022
            cibw-arch: AMD64
            cmake-args: "-DTREEWEAVE_C_MULTIARCH=ON -DTREEWEAVE_VERIFY_RUNGS=ON -DTREEWEAVE_ARCH=x86-64 -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DTREEWEAVE_WARNINGS_AS_ERRORS=OFF"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # A staging build pins X.Y.Z.devN here: CMake's numeric project version
      # cannot carry a .devN suffix, so pyproject is overridden statically.
      # cibuildwheel copies this dir into the build container, so the edit sticks.
      - name: Pin dev version
        if: inputs.dev-version != ''
        shell: bash
        run: python .github/scripts/set_dev_version.py "${{ inputs.dev-version }}"

      # clang-cl, not cl.exe, because that is what the release ships; both are
      # sound since the rung rename. cibuildwheel builds in the host
      # environment on Windows, so vcvarsall and LLVM here reach the build.
      - name: Setup clang-cl + Ninja (Windows)
        if: matrix.name == 'windows-x64'
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: llvm
          cmake: true
          ninja: true
          vcvarsall: true

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: bindings/python
        env:
          CIBW_ARCHS: ${{ matrix.cibw-arch }}
          # scikit-build-core forwards CMAKE_ARGS to the core build; this is how
          # each runner pins its portable baseline / multiarch dispatch.
          CIBW_ENVIRONMENT: >-
            CMAKE_ARGS="${{ matrix.cmake-args }}"
            MACOSX_DEPLOYMENT_TARGET=11.0
          # Windows override: Ninja, because the default VS generator ignores
          # CMAKE_CXX_COMPILER and would build with cl.exe anyway.
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_ARGS="${{ matrix.cmake-args }}"
            CMAKE_GENERATOR=Ninja
          # Exercise each built wheel on its own platform (native runners, no
          # emulation) so a release wheel that imports/computes wrong is caught
          # here, not by users. {package} is the package-dir (bindings/python).
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: pytest {package}/tests

      # Second line of defence on the linked artifact (the build-time rung
      # gate above runs on the objects): the fan-out's rungs share every weak
      # symbol no rung name distinguishes, and the linker keeps one copy.
      # Check the extension that ships, where that choice is already made.
      - name: Check for an ISA leak
        if: contains(matrix.cmake-args, 'TREEWEAVE_VERIFY_RUNGS=ON')
        shell: bash
        run: |
          mkdir -p /tmp/whl-audit
          for w in wheelhouse/*.whl; do unzip -oq "$w" -d /tmp/whl-audit; done
          # A read loop, not mapfile: macOS ships bash 3.2 (see _build-c-abi.yml).
          libs=()
          while IFS= read -r lib; do
            libs+=("$lib")
          done < <(find /tmp/whl-audit -type f \
            \( -name '*.so' -o -name '*.dylib' -o -name '*.pyd' \))
          test "${#libs[@]}" -gt 0 || { echo "no extension library found"; exit 1; }
          bash .github/scripts/check_isa_leak.sh "${libs[@]}"

      # The cibuildwheel action runs from the repo root, so wheelhouse/ lands there.
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # A staging build pins X.Y.Z.devN here: CMake's numeric project version
      # cannot carry a .devN suffix, so pyproject is overridden statically.
      - name: Pin dev version
        if: inputs.dev-version != ''
        shell: bash
        run: python .github/scripts/set_dev_version.py "${{ inputs.dev-version }}"

      - name: Build sdist
        run: pipx run build --sdist --outdir dist bindings/python
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
