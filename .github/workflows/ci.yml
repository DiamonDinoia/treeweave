# Throwaway measurement workflow (branch ci-debug/win-hang). Builds only the
# test_cpp.cpp.obj edge of the windows-2022 llvm Release leg with -ftime-trace,
# under a 60 min cap, and uploads the trace and the timing. `code_ref` selects
# the code under test, so runs A and B can dispatch from this one branch at the
# same time.
name: diag-test-cpp

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "A = base code, B = base code plus the candidate fix"
        type: choice
        options:
          - A
          - B
        default: A
      code_ref:
        description: "git ref (sha) of the code to build"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: windows-2022 (llvm Release) test_cpp obj ${{ inputs.variant }}
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code_ref }}
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.10.1
        with:
          compiler: llvm
          cmake: true
          ninja: true
          cache-tools: true
          vcvarsall: true

      - name: Configure
        # clang-cl takes -ftime-trace as a driver flag; -Xclang forwarding
        # fails with "unknown argument" on this toolchain.
        run: cmake --preset ci-windows-clang "-DCMAKE_CXX_FLAGS=-ftime-trace"

      - name: Build test_cpp.cpp.obj, 60 min cap
        timeout-minutes: 62
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "BUILD START $(Get-Date -Format o) variant=${{ inputs.variant }} code_ref=${{ inputs.code_ref }}"
          $p = Start-Process -FilePath cmd.exe -ArgumentList "/c ninja -C build\ci-windows-clang -v tests/CMakeFiles/test_cpp.dir/test_cpp.cpp.obj > obj-build.txt 2>&1" -NoNewWindow -PassThru
          $m = Measure-Command { try { Wait-Process -Id $p.Id -Timeout 3540 -ErrorAction Stop } catch { } }
          $mins = [math]::Round($m.TotalMinutes, 2)
          Write-Host "BUILD END $(Get-Date -Format o)"
          if ($p.HasExited) {
            Write-Host "OBJ EXIT=$($p.ExitCode) MINUTES=$mins"
            Set-Content -Path obj-timing.txt -Value "variant=${{ inputs.variant }} code_ref=${{ inputs.code_ref }} exit=$($p.ExitCode) minutes=$mins"
          } else {
            Write-Host "OBJ HUNG at 59 min cap"
            Get-Process | Sort-Object CPU -Descending | Select-Object -First 25 Id, ProcessName, CPU, WS | Format-Table | Out-String | Write-Host
            $last = Get-Content obj-build.txt -Tail 1
            Write-Host "LAST LOG LINE: $last"
            Set-Content -Path obj-timing.txt -Value "variant=${{ inputs.variant }} code_ref=${{ inputs.code_ref }} HUNG minutes=$mins last=$last"
            taskkill /T /F /PID $p.Id
          }
          Get-Content obj-build.txt | Select-Object -Last 5

      - name: Upload trace and timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-cpp-obj-${{ inputs.variant }}
          path: |
            obj-build.txt
            obj-timing.txt
            build/ci-windows-clang/tests/CMakeFiles/test_cpp.dir/*.json
          if-no-files-found: ignore
