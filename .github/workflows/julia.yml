name: Julia

# Julia wrapper: builds libtreeweave_c, dlopens it, and runs runtests.jl via the
# julia_treeweave CTest target. Split out from the former bindings.yml so it earns
# its own status badge. The matrix builds + runs the suite from source on every
# platform the release ships a prebuilt for, so a wrapper bug lands on a PR, not
# post-release. The macos-14 (Apple Silicon) leg is load-bearing: the @cfunction
# callback in Treeweave.jl must not capture a closure, since closure cfunctions
# are unsupported on aarch64-apple-darwin.
on:
  push:
    branches: [main]
  pull_request:
  # Branch runs: this workflow gates the release and fires on push to main
  # only, so a change to it has no other way to run before it lands.
  workflow_dispatch:

concurrency:
  group: julia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  julia:
    name: Julia bindings (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,     runs-on: ubuntu-24.04,     compiler: gcc }
          - { name: linux-aarch64,    runs-on: ubuntu-24.04-arm, compiler: gcc }
          - { name: macos-14-arm64,   runs-on: macos-14,         compiler: apple-clang }
          - { name: macos-15-arm64,   runs-on: macos-15,         compiler: apple-clang }
          - { name: macos-15-x86_64,  runs-on: macos-15-intel,   compiler: apple-clang }
          # cl.exe, to match what the release ships. This leg is single-arch,
          # where the rung rename does not apply.
          - { name: windows-x64,      runs-on: windows-2022,     compiler: msvc,
              cmake_extra: '-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
          cache-tools: true
          vcvarsall: ${{ runner.os == 'Windows' }}

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Configure + build libtreeweave_c
        run: |
          cmake --preset bindings-julia ${{ matrix.cmake_extra }}
          cmake --build build/bindings-julia -j --target treeweave_c

      - name: Run Julia suite (julia_treeweave)
        run: ctest --test-dir build/bindings-julia -R julia_treeweave --output-on-failure --no-tests=error

  compare-interpolators:
    name: Comparison against other Julia interpolators
    runs-on: ubuntu-24.04
    # Reaching 1e-10 with a uniform cubic grid takes 5e5 knots on two of the
    # three targets, and every method is grown to that accuracy before it is
    # measured.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Configure + build libtreeweave_c
        run: |
          cmake --preset bindings-julia -DTREEWEAVE_ARCH=x86-64-v3
          cmake --build build/bindings-julia -j --target treeweave_c

      - name: Install the comparison field
        run: |
          julia -e 'using Pkg
                    Pkg.develop(path="bindings/julia/Treeweave")
                    Pkg.add(["Interpolations", "Dierckx", "FastChebInterp", "DataInterpolations"])'

      - name: Self-test the comparison's own gates
        env:
          LIBTREEWEAVE_C: ${{ github.workspace }}/build/bindings-julia/libtreeweave_c.so
        run: julia benchmarks/compare_interpolators.jl --self-test

      # --check-docs re-measures the deterministic columns and fails if the Julia
      # tables in docs/guides/performance.rst no longer match. Regenerate with --rst.
      - name: Run the comparison and hold the docs tables to it
        env:
          LIBTREEWEAVE_C: ${{ github.workspace }}/build/bindings-julia/libtreeweave_c.so
        run: julia benchmarks/compare_interpolators.jl --check-docs
