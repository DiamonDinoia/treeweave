name: Julia

# Julia wrapper: builds libtreeweave_c, dlopens it, and runs runtests.jl via the
# julia_treeweave CTest target. Split out from the former bindings.yml so it earns
# its own status badge. The macos-14 (Apple Silicon) leg is load-bearing: the
# @cfunction callback in Treeweave.jl must not capture a closure, since closure
# cfunctions are unsupported on aarch64-apple-darwin.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: julia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  julia:
    name: Julia bindings (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runs-on: ubuntu-24.04, compiler: gcc }
          - { name: macos-arm64,  runs-on: macos-14,      compiler: apple-clang }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
          cache-tools: true

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Configure + build libtreeweave_c
        run: |
          cmake --preset bindings-julia
          cmake --build build/bindings-julia -j --target treeweave_c

      - name: Run Julia suite (julia_treeweave)
        run: ctest --test-dir build/bindings-julia -R julia_treeweave --output-on-failure
