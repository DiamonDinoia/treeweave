name: Build Node prebuilds

# Reusable builder (workflow_call only — leading underscore marks it internal).
# Produces per-platform native N-API addons (treeweave.node) as run artifacts,
# laid out under prebuilds/<platform>-<arch>/ so node-gyp-build picks the right
# one at install/runtime. The Release orchestrator (release.yml) calls this and
# bundles the assembled prebuilds/ into the npm package before pack/publish.
#
# N-API is ABI-stable across Node majors (the addon builds with NAPI_VERSION=8),
# so ONE binary per platform serves every Node version — no per-Node matrix,
# unlike Python wheels. Each Linux leg runs inside the same manylinux_2_28 image
# the wheels/C-ABI use, so the glibc floor is 2.28, not the runner's. x86 enables
# TREEWEAVE_C_MULTIARCH (one binary dispatches SSE4.2/AVX2/AVX-512 at runtime);
# Linux aarch64 likewise at armv8-a; Apple silicon and MSVC build one baseline.
# The published JS package stays WASM-capable: WASM remains the browser backend
# and the fallback when no prebuild matches the host.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from (commit SHA / branch / tag)'
        required: true
        type: string
      fail_on_error:
        description: >-
          If true, every leg is required (a failure fails the job). CI
          (js-prebuilds.yml) sets this to catch regressions pre-merge. The
          release leaves it false so a transient hiccup on a best-effort
          platform degrades to WASM fallback instead of blocking npm publish.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prebuild:
    name: ${{ matrix.platdir }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    container: ${{ matrix.container }}
    # Best-effort legs (optional: true) may fail without blocking a RELEASE — a
    # missing prebuild just means that platform falls back to the bundled WASM
    # backend, and release.yml deliberately keeps the npm/GitHub Release going
    # (see its github-release always() gate). But js-prebuilds.yml runs this same
    # builder per-PR with fail_on_error=true, so a regression on ANY platform is
    # caught pre-merge rather than surfacing silently at release time. Linux is
    # always required (no optional flag) — it has no WASM-only fallback story.
    continue-on-error: ${{ matrix.optional == 'true' && !inputs.fail_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platdir: linux-x64
            runs-on: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            multiarch: 'ON'
            arch: x86-64
          - platdir: linux-arm64
            runs-on: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            multiarch: 'ON'
            arch: armv8-a
          - platdir: darwin-arm64
            runs-on: macos-14
            container: ''
            multiarch: 'OFF'
            arch: apple-m1
            optional: 'true'
          - platdir: darwin-x64
            runs-on: macos-15-intel
            container: ''
            multiarch: 'ON'
            arch: x86-64
            optional: 'true'
          - platdir: win32-x64
            runs-on: windows-2022
            container: ''
            multiarch: 'OFF'
            arch: x86-64
            optional: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'  # node 20 needs glibc >= 2.28, met by manylinux_2_28

      # manylinux images ship a compiler but not CMake/Ninja; pipx is present.
      - name: Install CMake/Ninja (manylinux)
        if: startsWith(matrix.platdir, 'linux')
        run: pipx install cmake ninja

      # macOS/Windows: CMake + Ninja via setup-cpp, with the MSVC environment on
      # Windows so the addon builds with Ninja (single-config) like everywhere else.
      # Windows also installs LLVM; the addon compiles with clang-cl, not cl.exe.
      - name: Setup CMake + Ninja (macOS/Windows)
        if: ${{ !startsWith(matrix.platdir, 'linux') }}
        uses: aminya/setup-cpp@8170d66c458f4a045220b7b0966c10940bb2a15d  # v1.8.1
        with:
          compiler: ${{ matrix.platdir == 'win32-x64' && 'llvm' || '' }}
          cmake: true
          ninja: true
          vcvarsall: ${{ matrix.platdir == 'win32-x64' }}

      - name: Install node-addon-api headers
        shell: bash
        run: npm ci
        working-directory: bindings/js

      - name: Configure + build the N-API addon
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          extra=()
          if [[ "${{ matrix.platdir }}" == win32-* ]]; then
            # Windows node ships no C headers and MSVC needs node's import lib to
            # resolve napi_* (see js CMakeLists). Fetch both from the dist for the
            # exact node version set up above — the node-gyp approach.
            nodever=$(node -p 'process.version')
            curl -fL -o node.lib "https://nodejs.org/dist/${nodever}/win-x64/node.lib"
            curl -fL -o node-headers.tar.gz "https://nodejs.org/dist/${nodever}/node-${nodever}-headers.tar.gz"
            tar xzf node-headers.tar.gz
            # clang-cl, not cl.exe: cl.exe needs ~58 min per dim3 C-ABI TU at the
            # SSE2 baseline and blows the 90-minute cap; clang-cl needs ~40 s and
            # keeps the flatten path. Warnings-as-errors off, as in ci-windows-clang.
            extra+=(
              "-DTREEWEAVE_NODE_LIB=$PWD/node.lib"
              "-DTREEWEAVE_NODE_INCLUDE=$PWD/node-${nodever}/include/node"
              "-DCMAKE_C_COMPILER=clang-cl"
              "-DCMAKE_CXX_COMPILER=clang-cl"
              "-DTREEWEAVE_WARNINGS_AS_ERRORS=OFF"
            )
          fi
          # TREEWEAVE_VERIFY_RUNGS runs the cross-rung symbol gate at build
          # time (tests are OFF here, so the ctest registration never fires).
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTREEWEAVE_BUILD_TESTS=OFF \
            -DTREEWEAVE_BUILD_EXAMPLES=OFF \
            -DTREEWEAVE_BUILD_JS=ON \
            -DTREEWEAVE_C_MULTIARCH=${{ matrix.multiarch }} \
            -DTREEWEAVE_VERIFY_RUNGS=${{ matrix.multiarch }} \
            -DTREEWEAVE_ARCH=${{ matrix.arch }} \
            "${extra[@]}"
          cmake --build build -j --target treeweave_node

      # Lay the addon out where node-gyp-build looks: prebuilds/<platform>-<arch>/.
      # The `.napi` tag tells node-gyp-build it is ABI-stable across Node versions.
      - name: Assemble prebuilds/${{ matrix.platdir }}
        shell: bash
        run: |
          mkdir -p "prebuilds/${{ matrix.platdir }}"
          cp bindings/js/dist/treeweave.node "prebuilds/${{ matrix.platdir }}/treeweave.napi.node"
          ls -l "prebuilds/${{ matrix.platdir }}"

      # Second line of defence on the linked artifact (the build-time rung
      # gate runs on the objects): check the addon that ships, where the
      # linker's one-copy choice is already made.
      - name: Check for an ISA leak
        if: matrix.multiarch == 'ON'
        shell: bash
        run: |
          bash .github/scripts/check_isa_leak.sh \
            "prebuilds/${{ matrix.platdir }}/treeweave.napi.node"

      # The addon compiles with clang-cl but must stay a plain MSVC-ABI DLL: the
      # import table may name only the CRT and node.exe that a cl.exe build names.
      # An LLVM/libc++/compiler-rt import would mean an extra install dependency.
      - name: Check the Windows addon imports no LLVM runtime
        if: ${{ matrix.platdir == 'win32-x64' }}
        shell: cmd
        run: |
          dumpbin /dependents "prebuilds\win32-x64\treeweave.napi.node" > deps.txt
          type deps.txt
          findstr /i /r "libc++ LLVM clang_rt libunwind" deps.txt && exit /b 1
          exit /b 0

      - name: Smoke test the freshly built addon (Node import + eval)
        shell: bash
        run: node tests/smoke/node_native_smoke.mjs "$PWD/prebuilds/${{ matrix.platdir }}/treeweave.napi.node"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-prebuilds-${{ matrix.platdir }}
          path: prebuilds/${{ matrix.platdir }}/*.node
          if-no-files-found: error
