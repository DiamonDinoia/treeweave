name: Release install

# Validates that a PUBLISHED release is actually installable by a downstream
# user — the paths that only exist after publishing, which install-smoke.yml
# (TestPyPI / in-tree find_package / FetchContent) and the in-release
# verify-prebuilt job cannot cover:
#
#   * pip-from-pypi      — `pip install treeweave` from the real PyPI index
#                          across linux/macOS/windows × py3.9/3.12, then a tiny
#                          fit+eval smoke (tests/smoke/pip_smoke.py).
#   * c-abi-from-release — `gh release download` each per-platform C-ABI tarball
#                          asset, then a consumer cmake project does
#                          find_package(treeweave) + compile + run.
#   * npm-from-registry  — `npm install @flatironinstitute/treeweave` from the
#                          real npm registry (WASM-only, so any OS), then
#                          tests/smoke/npm_smoke.mjs fits + evals.
#   * wasm-from-release  — `gh release download` the standalone treeweave.wasm +
#                          treeweave.mjs assets (the web-fetch path, no npm), then
#                          tests/smoke/wasm_smoke.mjs fits + evals.
#
# Every job also runs the docs recipes for its route
# (tools/ci/docs-recipes.sh), so the download and registry lines the docs print
# are executed verbatim against the published release. Those lines are the only
# ones no pre-release check can cover: release.yml's dry run already runs the
# consume halves against the artifacts it builds.
#
# The Julia prebuilt-download path is covered by julia-smoke.yml (dispatched by
# release.yml's verify-prebuilt job), so it is not duplicated here.
#
# Runs on every published release, on demand, and weekly so a silent breakage in
# PyPI / npm / the Release assets is caught even between releases.
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

concurrency:
  group: release-install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-from-pypi:
    name: pip install (PyPI) — ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python-version: ['3.9', '3.12']  # oldest supported + abi3 floor
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The line docs/install.rst and guides/python.rst print, verbatim and
      # unpinned. The pinned install below then checks this exact version.
      - name: Docs recipes — pip install from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          tools/ci/docs-recipes.sh pip-install

      - name: Install treeweave from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip numpy
          # Pin to the released version on `release: published`; otherwise (cron /
          # dispatch) take latest. Strip a leading "v" from the tag.
          ver="${{ github.event.release.tag_name }}"
          ver="${ver#v}"
          spec="treeweave"
          [ -n "$ver" ] && spec="treeweave==$ver"
          # The release publish can briefly precede the index update; retry.
          for i in 1 2 3 4 5; do
            if python -m pip install "$spec"; then break; fi
            echo "$spec not on the PyPI index yet; retry $i"
            sleep 30
          done

      - name: Fit + eval smoke
        run: python tests/smoke/pip_smoke.py

  c-abi-from-release:
    name: C-ABI from Release (${{ matrix.pattern }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Ninja  # single-config build dir on every OS (build/smoke)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     pattern: '*linux-x86_64.tar.gz',  platform: linux-x86_64,  compiler: gcc }
          - { os: ubuntu-24.04-arm, pattern: '*linux-aarch64.tar.gz', platform: linux-aarch64, compiler: gcc }
          - { os: macos-14,         pattern: '*macos-arm64.tar.gz',   platform: macos-arm64,   compiler: llvm }
          - { os: windows-2022,     pattern: '*windows-x64.zip',      platform: windows-x64,   compiler: msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: ./.github/actions/setup-cpp
        with:
          compiler: ${{ matrix.compiler }}

      - name: Download the C-ABI tarball from the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On `release: published` use that tag; otherwise the latest release.
          tag="${{ github.event.release.tag_name }}"
          mkdir -p pkg
          gh release download $tag --repo "${{ github.repository }}" \
            --pattern '${{ matrix.pattern }}' --dir pkg
          ls -l pkg

      - name: Extract to a prefix
        id: c_abi_pkg
        shell: bash
        run: |
          mkdir -p _prefix
          # The glob can match a sibling asset (the treeweave-matlab-* bundle
          # shares the -macos-arm64 suffix); take the C-ABI package. Windows
          # ships a .zip, the rest a .tar.gz.
          pkgfile=$(ls pkg/${{ matrix.pattern }} | grep -v -- -matlab- | head -1)
          case "$pkgfile" in
            *.zip) unzip -q "$pkgfile" -d _prefix ;;
            *)     tar -C _prefix -xzf "$pkgfile" ;;
          esac
          echo "pkgfile=$pkgfile" >> "$GITHUB_OUTPUT"
          ls -R _prefix | head -40 || true  # head closes the pipe under pipefail

      - name: find_package(treeweave) + link treeweave_c + run
        shell: bash
        run: |
          # On Windows the DLL lives in bin/; the consumer exe must find it at
          # runtime. Harmless on linux/macOS (loader uses RPATH, not PATH).
          export PATH="$PWD/_prefix/bin:$PWD/_prefix/lib:$PATH"
          bash .github/scripts/smoke_find_package.sh "$PWD/_prefix"

      # The consume half of the C tarball recipe docs/install.rst, guides/c.rst
      # and guides/fortran.rst print, against the published asset. POSIX-only:
      # the printed recipe uses cc and LD_LIBRARY_PATH.
      - name: Docs recipes — compile against the C tarball
        if: runner.os == 'Linux'
        shell: bash
        env:
          TREEWEAVE_DOCS_PLATFORM: ${{ matrix.platform }}
          TREEWEAVE_DOCS_C_TARBALL: ${{ steps.c_abi_pkg.outputs.pkgfile }}
        run: tools/ci/docs-recipes.sh c-tarball

      # The download line itself, verbatim. It names linux-x86_64, so it runs
      # on that leg only; the other platforms differ in the name alone, which
      # scripts/check_docs_code.py holds to the _build-c-abi.yml matrix.
      - name: Docs recipes — the floating C tarball URL
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: tools/ci/docs-recipes.sh c-tarball-download

  cxx-headers-from-release:
    name: C++ headers from Release (-Iinclude, no CMake)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: ./.github/actions/setup-cpp

      - name: Download the arch-independent headers tarball from the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          mkdir -p pkg
          gh release download $tag --repo "${{ github.repository }}" \
            --pattern 'treeweave-cxx-headers.tar.gz' --dir pkg
          ls -l pkg

      - name: Extract + compile an example against the bundle with -Iinclude
        shell: bash
        run: |
          dest="$(mktemp -d)"
          tar -C "$dest" -xzf pkg/treeweave-cxx-headers.tar.gz
          g++ -std=c++20 -O3 examples/c++/simple1d.cpp -I"$dest/include" -o app
          ./app

      # The two halves of the header-bundle recipe docs/install.rst and
      # guides/cpp.rst print: the floating URL, then the compile against it.
      - name: Docs recipes — the floating header bundle URL
        shell: bash
        run: tools/ci/docs-recipes.sh cxx-headers-download

      - name: Docs recipes — compile against the header bundle
        shell: bash
        env:
          TREEWEAVE_DOCS_CXX_HEADERS: pkg/treeweave-cxx-headers.tar.gz
        run: tools/ci/docs-recipes.sh cxx-headers

  npm-from-registry:
    name: npm install (registry) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The line docs/install.rst and guides/js.rst print, verbatim and
      # unpinned. The pinned install below then checks this exact version.
      - name: Docs recipes — npm install from the registry
        shell: bash
        run: tools/ci/docs-recipes.sh npm-install

      - name: Install @flatironinstitute/treeweave from the registry
        shell: bash
        run: |
          # Pin to the released version on `release: published`; latest otherwise.
          ver="${{ github.event.release.tag_name }}"
          ver="${ver#v}"
          spec="@flatironinstitute/treeweave"
          [ -n "$ver" ] && spec="@flatironinstitute/treeweave@$ver"
          npm install "$spec"

      - name: Fit + eval smoke (WASM)
        run: node tests/smoke/npm_smoke.mjs

  wasm-from-release:
    name: Raw WASM from Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # release.yml deterministically attaches treeweave.wasm + treeweave.mjs
      # (build-js -> github-release), so this is a hard gate. Only a release
      # predating these assets (before this change landed) would lack them.
      - name: Download the standalone WASM assets from the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          mkdir -p wasm
          gh release download $tag --repo "${{ github.repository }}" \
            --pattern 'treeweave.wasm' --pattern 'treeweave.mjs' --dir wasm
          ls -l wasm

      - name: Fit + eval smoke (raw WASM)
        run: node tests/smoke/wasm_smoke.mjs wasm/treeweave.mjs
