name: Install smoke

# Builds and runs every quick-start consumer project under examples/quickstart/.
# Those projects are exactly what docs/install.rst and the language guides embed
# with `literalinclude`, so this workflow is what keeps a docs page a tested
# artifact instead of a stale snippet. tools/ci/install-test.sh is the same entry
# point a developer runs locally, so a CI failure reproduces in one command.
#
# Routes:
#   cpp-fetchcontent : FetchContent -> header-only treeweave::treeweave
#   cpp-cpm          : CPMAddPackage -> the same target
#   cpp-find_package : find_package against an installed prefix, C++ headers
#   c-find_package   : find_package against an installed prefix, C ABI
#   cxx-headers      : the release header tarball, one -I, no CMake
#
# The pip/TestPyPI leg stays here because it needs a published wheel. The Julia
# Pkg.add -> GitHub Release path is covered by julia-smoke.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: ["TestPyPI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Scope by trigger as well as ref: the push run (the route matrix) and the
  # TestPyPI-driven workflow_run run (pip job) both land on refs/heads/main, so a
  # shared group would let the later workflow_run cancel the in-flight push run,
  # leaving no green push run for the Release gate.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quickstart-routes:
    name: Quick-start routes (${{ matrix.os }})
    # Skip on the workflow_run trigger: that event is only for the pip job.
    if: github.event_name != 'workflow_run'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
          - os: windows-2022
            compiler: llvm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
          cache-tools: true
          vcvarsall: ${{ runner.os == 'Windows' }}

      - name: Build and run every quick-start route
        run: |
          # cl.exe on Windows, matching the toolchain the release ships. This leg
          # is single-arch, where the rung rename does not apply.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export TREEWEAVE_CMAKE_ARGS="-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DTREEWEAVE_WARNINGS_AS_ERRORS=OFF"
          fi
          tools/ci/install-test.sh

  # README: pip install from TestPyPI. Only meaningful once a wheel is published,
  # so gate on the TestPyPI workflow having succeeded (or a manual dispatch).
  pip-testpypi:
    name: pip install (TestPyPI)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install from TestPyPI (deps from PyPI) and run the docs example
        run: |
          # TestPyPI's index can lag the publish by a minute; retry a few times.
          for i in 1 2 3 4 5; do
            if pip install --index-url https://test.pypi.org/simple/ \
                           --extra-index-url https://pypi.org/simple/ treeweave; then
              break
            fi
            echo "treeweave not on the TestPyPI index yet; retry $i"
            sleep 30
          done
          python -c "import importlib.metadata as m; print('treeweave', m.version('treeweave'))"
          # The very file docs/install.rst embeds for the Python route.
          python bindings/python/examples/simple_1d.py
