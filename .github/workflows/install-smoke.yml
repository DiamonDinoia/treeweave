name: Install smoke

# Builds and runs every quick-start consumer project under examples/quickstart/.
# Those projects are exactly what docs/install.rst and the language guides embed
# with `literalinclude`, so this workflow is what keeps a docs page a tested
# artifact instead of a stale snippet. tools/ci/install-test.sh is the same entry
# point a developer runs locally, so a CI failure reproduces in one command.
#
# Routes:
#   cpp-fetchcontent : FetchContent -> header-only treeweave::treeweave
#   cpp-cpm          : CPMAddPackage -> the same target
#   cpp-find_package : find_package against an installed prefix, C++ headers
#   c-find_package   : find_package against an installed prefix, C ABI
#   cxx-headers      : the release header tarball, one -I, no CMake
#
# The cxx-headers route above compiles the bundle with the platform's own
# compiler, MSVC-ABI clang included. The POSIX command the docs print for it
# (`c++ ... && ./app`) is a docs recipe, run on the Linux leg below.
#
# That leg also runs the docs recipes that consume a quick-start project the way a
# user does, with no substitution: quickstart-build really fetches the `stable`
# branch, quickstart-prefix really extracts a tarball. install-test.sh proves
# this PR's code; those two prove the documented recipe.
#
# The source-build recipes (clone, presets, install prefix, one -I, dispatch)
# run in their own job here. They were a second workflow before, which rebuilt
# trees this one already builds.
#
# The pip/TestPyPI leg stays here because it needs a published wheel. The Julia
# Pkg.add -> GitHub Release path is covered by julia-smoke.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: ["TestPyPI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Scope by trigger as well as ref: the push run (the route matrix) and the
  # TestPyPI-driven workflow_run run (pip job) both land on refs/heads/main, so a
  # shared group would let the later workflow_run cancel the in-flight push run,
  # leaving no green push run for the Release gate.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quickstart-routes:
    name: Quick-start routes (${{ matrix.os }})
    # Skip on the workflow_run trigger: that event is only for the pip job.
    if: github.event_name != 'workflow_run'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
          - os: windows-2022
            compiler: llvm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
          cache-tools: true
          vcvarsall: ${{ runner.os == 'Windows' }}

      - name: Build and run every quick-start route
        run: |
          # cl.exe on Windows, matching the toolchain the release ships. This leg
          # is single-arch, where the rung rename does not apply.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export TREEWEAVE_CMAKE_ARGS="-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DTREEWEAVE_WARNINGS_AS_ERRORS=OFF"
          fi
          tools/ci/install-test.sh

      # The literal user commands docs/install.rst prints. POSIX-only: the
      # printed recipe says ./build/app, which is not what MSVC names it. The
      # Windows leg above covers the same routes through install-test.sh.
      - name: Docs recipes
        if: runner.os == 'Linux'
        run: tools/ci/docs-recipes.sh quickstart-build quickstart-prefix cxx-headers

  # The source-build, install and dispatch recipes docs/install.rst,
  # guides/cmake.rst, guides/cpp.rst, guides/c.rst and guides/dispatch.rst print.
  # 60 minutes: the batch configures and builds the dev-release preset and a
  # multiarch tree of its own.
  source-recipes:
    name: Source-build recipes
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build

      - name: Docs recipes
        run: |
          tools/ci/docs-recipes.sh clone dev-build dev-test c-abi-build \
            install-prefix oneflag-cxx multiarch force-arch

  # README: pip install from TestPyPI. Only meaningful once a wheel is published,
  # so gate on the TestPyPI workflow having succeeded (or a manual dispatch).
  pip-testpypi:
    name: pip install (TestPyPI)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install from TestPyPI (deps from PyPI) and run the docs example
        run: |
          # The retry stays out here, not in the recipe: TestPyPI's index can
          # lag the publish by a minute, and the docs print one pip command.
          for i in 1 2 3 4 5; do
            if tools/ci/docs-recipes.sh pip-testpypi; then break; fi
            if [ "$i" = 5 ]; then
              echo "::error::pip install from TestPyPI never succeeded"
              exit 1
            fi
            echo "treeweave not on the TestPyPI index yet; retry $i"
            sleep 30
          done
          # The very file docs/install.rst embeds for the Python route.
          python bindings/python/examples/simple_1d.py
