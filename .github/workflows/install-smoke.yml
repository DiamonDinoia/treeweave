name: Install smoke

# Validates the install recipes in README.md / docs end to end, from a
# consumer's point of view: the paths the existing workflows do NOT cover:
#
#   * find_package  : build + install the C ABI to a prefix, then a separate
#                      consumer project does find_package(treeweave) and links
#                      treeweave::treeweave_c (README "Installed package").
#   * FetchContent  : a consumer project pulls treeweave in and links the
#                      header-only treeweave::treeweave (README "FetchContent").
#   * pip / TestPyPI: install the published wheel from TestPyPI and import +
#                      evaluate it (README "Install -> Python"). Runs after the
#                      TestPyPI workflow succeeds, since it needs the upload.
#
# The Julia Pkg.add -> GitHub Release path is already covered by julia-smoke.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: ["TestPyPI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Scope by trigger as well as ref: the push run (find_package + FetchContent)
  # and the TestPyPI-driven workflow_run run (pip job) both land on
  # refs/heads/main, so a shared group would let the later workflow_run cancel
  # the in-flight push run: leaving no green push run for the Release gate.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # README: find_package(treeweave) against an installed C ABI prefix.
  find-package:
    name: CMake find_package (installed C ABI, ${{ matrix.os }})
    # Skip on the workflow_run trigger: that event is only for the pip job.
    if: github.event_name != 'workflow_run'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
          - os: windows-2022
            compiler: llvm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
          cache-tools: true
          vcvarsall: ${{ runner.os == 'Windows' }}

      - name: Build + install the C ABI to a prefix
        run: |
          # cl.exe, as the release job does. This leg is single-arch, where the
          # rung rename does not apply at all; it matches the release only so the
          # smoke test covers the shipped toolchain.
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra+=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
                    -DTREEWEAVE_WARNINGS_AS_ERRORS=OFF)
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTREEWEAVE_BUILD_TESTS=OFF \
            -DTREEWEAVE_BUILD_EXAMPLES=OFF \
            "${extra[@]}"
          cmake --build build -j
          cmake --install build --prefix "$PWD/_prefix"

      - name: Consumer project, find_package + treeweave::treeweave_c
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer C)
          find_package(treeweave REQUIRED)
          add_executable(app main.c)
          # The consumer's own kernel uses libm (exp); link it explicitly since
          # modern ld (--as-needed) won't pull libm in transitively.
          find_library(MATH_LIBRARY m)
          target_link_libraries(app PRIVATE treeweave::treeweave_c $<$<BOOL:${MATH_LIBRARY}>:${MATH_LIBRARY}>)
          EOF
          cat > consumer/main.c <<'EOF'
          #include <treeweave.h>
          #include <math.h>
          #include <stdio.h>
          static void kernel(const double *x, double *y, void *ctx) { (void)ctx; y[0] = exp(x[0]); }
          int main(void) {
            double a = 0.0, b = 1.0;
            treeweave_t fn = treeweave_fit(kernel, 1, 1, &a, &b, 1e-10, NULL, NULL);
            double y = treeweave_eval_1d(fn, 0.5);
            fn = treeweave_free(fn);
            if (fabs(y - exp(0.5)) > 1e-8) { printf("FAIL: %g vs %g\n", y, exp(0.5)); return 1; }
            printf("OK: treeweave_eval_1d(0.5) = %g\n", y);
            return 0;
          }
          EOF
          prefix="$PWD/_prefix"
          app=consumer/build/app
          # Windows has no RPATH: treeweave_c.dll installs to bin/, so a
          # consumer must put that directory on PATH before running.
          if [ "$RUNNER_OS" = "Windows" ]; then
            PATH="$prefix/bin:$PATH"; export PATH
            prefix="$(cygpath -m "$prefix")"
            app=consumer/build/app.exe
          fi
          cmake -S consumer -B consumer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build consumer/build -j
          "./$app"

  # README: FetchContent -> header-only treeweave::treeweave (C++).
  fetchcontent:
    name: CMake FetchContent (header-only C++)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - name: Consumer project, FetchContent + treeweave::treeweave
        run: |
          # SOURCE_DIR pins treeweave to *this* checkout so the smoke tests the
          # tree under review; the README documents the GIT_REPOSITORY form.
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.20)
          project(consumer CXX)
          include(FetchContent)
          FetchContent_Declare(treeweave SOURCE_DIR "${GITHUB_WORKSPACE}")
          FetchContent_MakeAvailable(treeweave)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE treeweave::treeweave)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <treeweave/treeweave.hpp>
          #include <cmath>
          #include <cstdio>
          int main() {
            auto runge = [](double x) { return 1.0 / (1.0 + 25.0 * x * x); };
            auto fn    = treeweave::fit(runge, -1.0, 1.0, 1e-10);
            double y   = fn(0.3);
            if (std::abs(y - runge(0.3)) > 1e-8) { std::printf("FAIL: %g\n", y); return 1; }
            std::printf("OK: fn(0.3) = %g\n", y);
            return 0;
          }
          EOF
          # No -DTREEWEAVE_BUILD_TESTS/EXAMPLES=OFF here on purpose: as a
          # non-top-level (FetchContent) consumer those default OFF, so this also
          # asserts the consumer build stays baggage-free.
          cmake -S consumer -B consumer/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer/build -j
          ./consumer/build/app

  # README: header-only "download & -Iinclude" drop-in (no CMake link, no lib).
  # Build the consolidated build/include tree, tar it exactly as the release
  # cxx-headers asset is packed, extract to a temp dir, then compile+run the
  # standalone demo with just -Iinclude, simulating the download without a
  # published release.
  cxx-headers:
    name: C++ headers drop-in (-Iinclude, no CMake)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - name: Build the consolidated headers tree
        run: |
          cmake -S . -B build -G Ninja -DTREEWEAVE_BUILD_EXAMPLES=ON
          cmake --build build -j

      - name: Pack + extract headers, then compile the standalone demo
        run: |
          # Pack exactly as _build-c-abi.yml packs the cxx-headers asset.
          tar -C build -czf hdrs.tar.gz include
          dest="$(mktemp -d)"
          tar -C "$dest" -xzf hdrs.tar.gz
          g++ -std=c++20 -O3 examples/standalone/demo.cpp -I"$dest/include" -o app
          ./app

  # README: pip install from TestPyPI. Only meaningful once a wheel is published,
  # so gate on the TestPyPI workflow having succeeded (or a manual dispatch).
  pip-testpypi:
    name: pip install (TestPyPI)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install from TestPyPI (deps from PyPI) and evaluate
        run: |
          # TestPyPI's index can lag the publish by a minute; retry a few times.
          for i in 1 2 3 4 5; do
            if pip install --index-url https://test.pypi.org/simple/ \
                           --extra-index-url https://pypi.org/simple/ treeweave; then
              break
            fi
            echo "treeweave not on the TestPyPI index yet; retry $i"
            sleep 30
          done
          python - <<'EOF'
          import math, numpy as np, treeweave
          import importlib.metadata
          print("treeweave", importlib.metadata.version('treeweave'))
          approx = treeweave.fit(lambda x: math.exp(x[0]), 0.0, 1.0, tol=1e-10)
          xs = np.linspace(0.0, 1.0, 11, endpoint=False)
          err = float(np.max(np.abs(approx(xs) - np.exp(xs))))
          assert err < 1e-8, err
          print(f"OK: max abs error {err:.2e}")
          EOF
