# Throwaway probe: does the multi-arch C ABI, statically linked into the Python
# extension, still fault on Windows? wheels.yml disabled multiarch there before
# the 0.0.5 fan-out. Reproduces cibuildwheel's Windows path without publishing.
# Delete this workflow and its branch once the answer is recorded.
name: probe windows wheel multiarch

on:
  push:
    branches: [fix/windows-multiarch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.cc }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # clang-cl only: cl.exe emits the horner_impl lambdas as external
        # COMDATs per rung, so it fails check_rung_symbols before any wheel
        # exists (probe 33093417068).
        include:
          - cc: clang-cl
            setup: llvm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: ${{ matrix.setup }}
          cmake: true
          ninja: true
          vcvarsall: true

      - name: Build the extension (multiarch, static C ABI) and time it
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_ARGS: >-
            -DTREEWEAVE_C_MULTIARCH=ON
            -DTREEWEAVE_VERIFY_RUNGS=ON
            -DTREEWEAVE_ARCH=x86-64
            -DCMAKE_C_COMPILER=${{ matrix.cc }}
            -DCMAKE_CXX_COMPILER=${{ matrix.cc }}
            -DTREEWEAVE_WARNINGS_AS_ERRORS=OFF
        run: |
          python -m pip install --upgrade pip pytest numpy
          $sw = [Diagnostics.Stopwatch]::StartNew()
          python -m pip install -v ./bindings/python
          $rc = $LASTEXITCODE
          $sw.Stop()
          "PROBE_BUILD cc=${{ matrix.cc }} minutes=$([math]::Round($sw.Elapsed.TotalMinutes,1)) rc=$rc"
          if ($rc -ne 0) { throw "build failed with rc=$rc" }

      # The fault was an illegal instruction inside treeweave_fit at every ISA
      # level, so the import plus the suite is the check that would catch it.
      - name: Run the wheel's own test suite
        run: |
          python -c "import treeweave; print(treeweave.__file__)"
          python -m pytest bindings/python/tests -q
          "PROBE_TEST cc=${{ matrix.cc }} rc=$LASTEXITCODE"
