name: MATLAB

# Real MATLAB (not Octave): setup-matlab@v3 puts MATLAB on PATH so the
# bindings-matlab preset's FindMatlab picks it up and the MEX compiles — that
# build is the hard gate here. Actually *running* the suite needs a license,
# which MathWorks' hosted licensing does not reliably grant for `matlab -batch`
# launched outside matlab-actions/run-command (observed: "MathWorks Licensing
# Error 1"). The run step is therefore best-effort; octave.yml runs the identical
# `matlab_treeweave` test and is the blocking runtime gate. This workflow is NOT
# a hard release gate (see release.yml preflight). Split out from the former
# bindings.yml so it earns its own (best-effort) status badge.
# Non-gating + slow MATLAB setup: runs on PRs + on demand only. The prebuilt
# MATLAB MEX is built and packaged in the release pipeline (_build-mex.yml);
# octave.yml gates the shared mwrap gateway logic on every push.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: matlab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matlab:
    name: MATLAB bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      # bindings-matlab sets TREEWEAVE_BUILD_MATLAB=ON; with MATLAB (and no
      # mkoctfile) present, the MATLAB MEX backend is selected. The mwrap gateway
      # is checked in (bindings/matlab/generated/) and compiled directly — no CPM,
      # no mwrap, no bison/flex. The regen-check job below guards its freshness.
      - name: Configure + build the MATLAB MEX
        run: |
          cmake --preset bindings-matlab
          cmake --build build/bindings-matlab -j

      # test_treeweave.m calls error() on any failure -> matlab -batch exits non-zero.
      # Best-effort: skip blocking CI when no MATLAB license is available on the
      # runner (the Octave job is the blocking runtime gate). Build above stays a gate.
      - name: Run MATLAB suite (matlab_treeweave)
        continue-on-error: true
        run: ctest --test-dir build/bindings-matlab -R matlab_treeweave --output-on-failure

  # Windows MEX, built and *run* under several MATLAB releases. Until v0.0.4 no
  # Windows job ever loaded the MEX it built, and three releases shipped a MEX
  # linked against the debug CRT that no machine without Visual Studio could
  # load. This job is that missing check: it asserts the build is optimized, that
  # the binary imports the redistributable CRT, and that the oldest MATLAB release
  # setup-matlab installs still runs the suite against a clang-cl build.
  matlab-windows:
    name: Windows MEX / ${{ matrix.matlab }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        matlab: [R2021a, R2022b, R2024b, latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          cmake: true
          ninja: true
          vcvarsall: true
          cache-tools: true

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab }}

      # No CMAKE_BUILD_TYPE on purpose: the project defaults it to Release before
      # project(), and the next step asserts that default survives on Windows.
      - name: Configure + build the MATLAB MEX (clang-cl)
        shell: pwsh
        run: |
          # TREEWEAVE_VERIFY_RUNGS: cross-rung symbol gate at build time — the
          # bindings preset turns the test suite off (no ctest registration)
          # and a linked PE keeps no symbol table for check_isa_leak.sh, so
          # this is the only gate that covers a Windows multiarch build.
          cmake --preset bindings-matlab `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DTREEWEAVE_ARCH=x86-64 -DTREEWEAVE_C_MULTIARCH=ON `
            -DTREEWEAVE_VERIFY_RUNGS=ON
          $bt = (Select-String -Path build/bindings-matlab/CMakeCache.txt `
                   -Pattern '^CMAKE_BUILD_TYPE:').Line
          Write-Host "cache: $bt"
          if ($bt -notmatch 'Release') { throw "expected a Release default, got: $bt" }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmake --build build/bindings-matlab --target treeweave_mex_matlab -j
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $sw.Stop()
          Write-Host ("MEX build: {0:n1} min" -f $sw.Elapsed.TotalMinutes)

      - name: Reject a debug-CRT MEX
        shell: pwsh
        run: |
          $mex = Get-ChildItem build/bindings-matlab -Recurse -Filter treeweave_mex.mexw64 |
                 Select-Object -First 1
          if (-not $mex) { throw "treeweave_mex.mexw64 not found" }
          $deps = dumpbin /dependents $mex.FullName | Out-String
          Write-Host $deps
          if ($deps -match '(?i)(MSVCP\d+D|VCRUNTIME\d+(_1)?D|ucrtbased)\.dll') {
              throw "debug CRT imported by $($mex.FullName)"
          }
          "MEXDIR=$($mex.DirectoryName)" | Out-File -Append $env:GITHUB_ENV

      # run-command, not `matlab -batch`: hosted licensing only grants a license
      # through this action. test_treeweave calls error() on failure, so a
      # non-zero exit is a real failure of the clang-cl MEX under this release.
      - name: Run test_treeweave
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('bindings/matlab'); addpath(getenv('MEXDIR')); test_treeweave

  # The mwrap gateway (bindings/matlab/generated/) is checked in and compiled by
  # default. This job is the only thing keeping it in sync with treeweave.mw:
  # rerun mwrap and fail if the output differs from what's committed. Fast (no
  # MATLAB) — CMake + the mwrap generator + a git diff.
  regen-check:
    name: mwrap gateway is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      # octave-dev gives mkoctfile so the binding's CMakeLists selects a backend
      # (else it skips and the regen target is never defined); bison/flex/m4 build
      # the mwrap generator's parser/lexer.
      - name: Install Octave + mwrap deps
        run: sudo apt-get update && sudo apt-get install -y octave-dev bison flex m4

      # OFF flips the binding to fetch+build mwrap; treeweave_mw_regen runs it and
      # writes the fresh output back into bindings/matlab/generated/.
      - name: Regenerate the gateway from treeweave.mw
        run: |
          cmake --preset bindings-octave -DTREEWEAVE_MATLAB_USE_PREGENERATED=OFF
          cmake --build build/bindings-octave --target treeweave_mw_regen

      - name: Fail if generated/ is stale
        run: |
          if ! git diff --exit-code -- bindings/matlab/generated/; then
            echo "::error::bindings/matlab/generated/ is out of date. Configure with" \
              "-DTREEWEAVE_MATLAB_USE_PREGENERATED=OFF, build the treeweave_mw_regen" \
              "target, and commit the result."
            exit 1
          fi
