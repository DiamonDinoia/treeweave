name: Python

# Python (nanobind) wrapper: builds the extension and runs its pytest suite via
# the python_treeweave CTest target. Split out from the former bindings.yml so it
# earns its own status badge.
on:
  push:
    branches: [main]
  pull_request:
  # Branch runs: this workflow gates the release and fires on push to main
  # only, so a change to it has no other way to run before it lands.
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (nanobind) bindings (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runs-on: ubuntu-24.04,     arch: x86-64-v3 }
          - { name: linux-aarch64, runs-on: ubuntu-24.04-arm, arch: armv8-a }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python build/test deps
        run: python -m pip install --upgrade pip pytest numpy "nanobind>=2.0,!=3.0.*"

      - name: Configure + build
        run: |
          cmake --preset bindings-python -DTREEWEAVE_ARCH=${{ matrix.arch }}
          cmake --build build/bindings-python -j

      - name: Run pytest suite (python_treeweave)
        run: ctest --test-dir build/bindings-python -R python_treeweave --output-on-failure --no-tests=error

  # docs/guides/performance.rst prints this script's table and states that CI runs
  # it on every pull request. The script gates the reproducible columns (f-evals,
  # memory, achieved error) and --self-test proves those gates can fail, so a
  # regression in either the library or the published table fails here.
  compare-interpolators:
    name: Comparison against other interpolators
    runs-on: ubuntu-24.04
    # The scikit-learn arm solves a dense least-squares system per doubling step,
    # which dominates the runtime.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.1
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # scipy and numpy are required by the comparison; scikit-learn, chebpy
          # and baobzi are the optional comparators. chebpy is not on PyPI under
          # that name, so it comes from its own repository.
          python -m pip install numpy scipy scikit-learn baobzi "nanobind>=2.0,!=3.0.*" \
            git+https://github.com/chebpy/chebpy.git

      - name: Configure + build the Python extension
        run: |
          cmake --preset bindings-python -DTREEWEAVE_ARCH=x86-64-v3
          cmake --build build/bindings-python -j

      - name: Self-test the comparison's own gates
        run: PYTHONPATH=build/bindings-python/python-pkg python benchmarks/compare_interpolators.py --self-test

      # --check-docs re-measures the deterministic columns and fails if the tables
      # in docs/guides/performance.rst no longer match. Regenerate them with --rst.
      - name: Run the comparison and hold the docs tables to it
        run: PYTHONPATH=build/bindings-python/python-pkg python benchmarks/compare_interpolators.py --check-docs
