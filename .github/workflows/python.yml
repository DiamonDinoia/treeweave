name: Python

# Python (nanobind) wrapper: builds the extension and runs its pytest suite via
# the python_treeweave CTest target. Split out from the former bindings.yml so it
# earns its own status badge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (nanobind) bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1.8.0
        with:
          compiler: gcc
          cmake: true
          ninja: true
          cache-tools: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python build/test deps
        run: python -m pip install --upgrade pip pytest numpy "nanobind>=2.0"

      - name: Configure + build
        run: |
          cmake --preset bindings-python
          cmake --build build/bindings-python -j

      - name: Run pytest suite (python_treeweave)
        run: ctest --test-dir build/bindings-python -R python_treeweave --output-on-failure
