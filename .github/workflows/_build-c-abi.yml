name: Build C-ABI tarballs

# Reusable builder (workflow_call only — note the leading underscore in the
# filename marking it internal). Produces relocatable C-ABI (`libtreeweave_c`)
# tarballs for every supported OS/arch as run artifacts, at a static X.Y.Z. The
# Release orchestrator (release.yml) calls this; it is never triggered on its own.
#
# Each Linux build runs inside a manylinux_2_28 container so the glibc floor is
# 2.28 (RHEL 8 / Ubuntu 20.04+), not the runner's. x86 builds enable
# TREEWEAVE_C_MULTIARCH so one binary dispatches SSE4.2 / AVX2 / AVX-512 at
# runtime; Linux aarch64 likewise enables it at the armv8-a baseline (single
# mandatory neon64 variant). Apple silicon and MSVC build a single portable
# baseline. macOS binaries are shipped UNSIGNED (see the release notes for the
# `xattr` workaround).
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from (commit SHA / branch / tag)'
        required: true
        type: string
      version:
        description: 'Static release version X.Y.Z used in artifact names'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tarball:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    container: ${{ matrix.container }}
    # Optional legs (matrix.optional) must never block the release — a failure
    # there is reported but does not fail the build-c-abi job.
    continue-on-error: ${{ matrix.optional == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            multiarch: 'ON'
            arch: x86-64
          # Optional, NOT mandatory: same multiarch binary (baseline x86-64,
          # runtime-dispatches up to AVX-512) but built on the newer
          # manylinux_2_34 base (glibc 2.34, RHEL 9 / Ubuntu 22.04+) with its
          # current toolchain. Users on a recent OS can prefer this; everyone
          # else uses the manylinux_2_28 tarball above. Shipped as an extra
          # release asset, never gated.
          - name: linux-x86_64-manylinux_2_34
            runs-on: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_34_x86_64
            multiarch: 'ON'
            arch: x86-64
            optional: 'true'
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            multiarch: 'ON'
            arch: armv8-a
          - name: macos-arm64
            runs-on: macos-14
            container: ''
            multiarch: 'OFF'
            arch: apple-m1
          - name: macos-x86_64
            runs-on: macos-15-intel
            container: ''
            multiarch: 'ON'
            arch: x86-64
          - name: windows-x64
            runs-on: windows-2022
            container: ''
            multiarch: 'OFF'
            arch: x86-64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # manylinux images ship a toolchain but not CMake/Ninja; everything else
      # (compiler, git) is present. pipx is preinstalled on manylinux.
      - name: Install CMake/Ninja (manylinux)
        if: startsWith(matrix.name, 'linux')
        run: pipx install cmake ninja

      # macOS/Windows: provision CMake + Ninja via setup-cpp (no hand-rolled
      # brew/choco), with the MSVC environment on Windows so the shipped binary
      # builds with Ninja like every other platform, not the slow VS generator.
      - name: Setup CMake + Ninja (macOS/Windows)
        if: ${{ !startsWith(matrix.name, 'linux') }}
        uses: aminya/setup-cpp@8170d66c458f4a045220b7b0966c10940bb2a15d  # v1.8.1
        with:
          cmake: true
          ninja: true
          # cl.exe needs ~58 min on one dispatch TU at the SSE2 baseline and
          # blows the 90 min cap; clang-cl needs ~24 s.
          compiler: ${{ matrix.name == 'windows-x64' && 'llvm' || '' }}
          vcvarsall: ${{ matrix.name == 'windows-x64' }}

      - name: Package name
        id: ver
        shell: bash
        run: echo "pkg=treeweave-${{ inputs.version }}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # Single-config generators (Ninja) on Linux/macOS.
      - name: Configure + build + install (Ninja)
        if: matrix.name != 'windows-x64'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          # Force install to lib/ (not GNUInstallDirs' lib64 on RHEL/manylinux):
          # CMake only searches <prefix>/lib64 for config packages on distros
          # where that is the convention, so a lib64 layout makes
          # find_package(treeweave) fail for Debian/Ubuntu consumers of the
          # relocatable tarball. lib/ is searched everywhere.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DTREEWEAVE_BUILD_TESTS=OFF \
            -DTREEWEAVE_BUILD_EXAMPLES=OFF \
            -DTREEWEAVE_RELEASE_VERSION=${{ inputs.version }} \
            -DTREEWEAVE_C_MULTIARCH=${{ matrix.multiarch }} \
            -DTREEWEAVE_ARCH=${{ matrix.arch }}
          cmake --build build -j
          cmake --install build --prefix dist

      # MSVC via Ninja (single-config): /MD dynamic CRT is the Release default.
      # Produces treeweave_c.dll (RUNTIME -> bin/) and treeweave_c.lib import lib.
      - name: Configure + build + install (Windows, Ninja)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          # Quote the version -D: PowerShell otherwise mangles the bare
          # X.Y.Z token and CMake receives a truncated value (e.g. 0.0.0 -> 0),
          # failing the MAJOR.MINOR.PATCH check. The bash legs above are unaffected.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DTREEWEAVE_WARNINGS_AS_ERRORS=OFF `
            -DCMAKE_INSTALL_LIBDIR=lib `
            -DTREEWEAVE_BUILD_TESTS=OFF `
            -DTREEWEAVE_BUILD_EXAMPLES=OFF `
            "-DTREEWEAVE_RELEASE_VERSION=${{ inputs.version }}" `
            -DTREEWEAVE_C_MULTIARCH=OFF
          cmake --build build
          cmake --install build --prefix dist

      # See .github/scripts/check_isa_leak.sh: the fan-out's rungs share every
      # weak symbol no rung name distinguishes, and the linker keeps one copy.
      # Check the installed library, where that choice is already made.
      - name: Check for an ISA leak
        shell: bash
        run: |
          shopt -s nullglob
          libs=(dist/lib/libtreeweave_c.so.* dist/lib/libtreeweave_c.*.dylib \
                dist/bin/treeweave_c.dll)
          test "${#libs[@]}" -gt 0 || { echo "no installed library found"; exit 1; }
          bash .github/scripts/check_isa_leak.sh "${libs[@]}"

      - name: Smoke test (find_package + link)
        shell: bash
        run: bash .github/scripts/smoke_find_package.sh "$PWD/dist"

      - name: Package (tar.gz)
        if: matrix.name != 'windows-x64'
        shell: bash
        run: tar -C dist -czf "${{ steps.ver.outputs.pkg }}.tar.gz" .

      - name: Package (zip)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "${{ steps.ver.outputs.pkg }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.pkg }}
          path: |
            ${{ steps.ver.outputs.pkg }}.tar.gz
            ${{ steps.ver.outputs.pkg }}.zip
          if-no-files-found: ignore

      # Arch-independent C++ headers bundle for the no-CMake "download &
      # -Iinclude" path (issue #20). The C++ API is header-only, so the same
      # dist/include tree ships on every platform — build it ONCE, on the linux
      # x86_64 leg. release.yml's github-release job attaches artifacts/* via a
      # merge-multiple download, so this is picked up with no extra glue.
      #
      # Filename is deliberately UNVERSIONED so the release asset has a stable,
      # floating URL: .../releases/latest/download/treeweave-cxx-headers.tar.gz
      # always resolves to the newest release. Users who want to pin still can,
      # via the tagged path .../releases/download/vX.Y.Z/treeweave-cxx-headers.tar.gz.
      - name: Package C++ headers (tar.gz, arch-independent)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: tar -C dist -czf treeweave-cxx-headers.tar.gz include

      - name: Upload C++ headers artifact
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: treeweave-cxx-headers
          path: treeweave-cxx-headers.tar.gz
          if-no-files-found: error
